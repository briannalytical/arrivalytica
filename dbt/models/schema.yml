version: 2

models:
  - name: stg_price_observations
    description: One clean, typed row per unique price observation.
    columns:
      - name: origin
        tests: [not_null]
      - name: destination
        tests: [not_null]
      - name: price
        tests: [not_null]
      - name: depart_date
        tests: [not_null]
      - name: currency
        tests:
          - accepted_values:
              arguments:
                values: ["USD"]

  - name: fct_price_observations
    description: Observations enriched with booking-window measures.
    columns:
      - name: route
        tests: [not_null]
      - name: days_before_departure
        tests: [not_null]

  - name: route_daily_summary
    description: Per-route, per-pull-date price summary for trend lines.
    columns:
      - name: route
        tests: [not_null]
      - name: min_price
        tests: [not_null]
